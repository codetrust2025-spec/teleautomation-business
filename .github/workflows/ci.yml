name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: business_ci, POSTGRES_PASSWORD: business_ci, POSTGRES_DB: business_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U business_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://business_ci:business_ci@localhost:5432/business_ci
      DASHBOARD_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m core.migrations.runner
      - run: python -m compileall -q core services workers features main.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
        working-directory: dashboard
      - run: npm test -- --run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
        env: {TELEAUTOMATION_SAFE_UI_MODE: "true"}
      - run: curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:8200/health
      - if: always()
        run: docker compose down -v
